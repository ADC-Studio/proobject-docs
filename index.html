<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Документы проОбъект</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --text: #172033;
        --muted: #647084;
        --border: #d9dee8;
        --accent: #2f6fef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }

      .page {
        width: min(880px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: clamp(24px, 5vw, 48px);
        box-shadow: 0 18px 44px rgba(23, 32, 51, 0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 42px);
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        color: var(--muted);
        margin: 12px 0 0;
      }

      ul {
        display: grid;
        gap: 12px;
        list-style: none;
        margin: 28px 0 0;
        padding: 0;
      }

      a {
        display: block;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-weight: 800;
        padding: 16px 18px;
        text-decoration: none;
      }

      a:hover,
      a:focus {
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="panel">
        <h1>Документы проОбъект</h1>
        <p>Публичные страницы приложения для пользователей и публикации.</p>
        <ul>
          <li><a href="marketing.html">Marketing URL</a></li>
          <li><a href="support.html">Support URL</a></li>
          <li><a href="privacy-policy.html">Privacy Policy</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
